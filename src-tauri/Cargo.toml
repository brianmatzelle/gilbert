[package]
name = "guitar2discord"
version = "0.1.0"
description = "Stream application audio to Discord voice channels"
authors = ["You"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Discord
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "voice"] }
songbird = { version = "0.5", features = ["driver", "builtin-queue"] }

# Audio codec support for songbird
symphonia = { version = "0.5", features = ["pcm"] }

# Windows Audio (WASAPI)
wasapi = "0.22"

# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# Process enumeration
sysinfo = "0.32"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
