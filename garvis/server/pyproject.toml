[project]
name = "garvis-server"
version = "0.1.0"
description = "Garvis Voice Assistant Server for Discord"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Core web framework
    "aiohttp>=3.13.2",
    "fastapi>=0.127.1",
    "fastmcp>=2.14.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.40.0",
    "websockets>=15.0.1",
    "pydantic>=2.0.0",
    # Voice AI services
    "anthropic>=0.75.0",
    "deepgram-sdk>=5.3.0",
    "elevenlabs>=2.27.0",
    # PyTorch for Silero VAD
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    # Audio processing
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pydub>=0.25.0",
    # Discord voice assistant
    "py-cord[voice]>=2.6.0",
    "pynacl>=1.5.0",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    # Music playback (yt-dlp extracts audio stream URLs for FFmpegPCMAudio)
    "yt-dlp>=2024.0.0",
    # Local AI inference (optional - for USE_LOCAL_* modes)
    "openai>=1.0.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "kokoro-onnx>=0.5.0",
]
