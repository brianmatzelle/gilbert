[workspace]
members = ["xtask"]

[package]
name = "app_audio_vst"
version = "0.1.0"
description = "Stream any Windows app's audio into your DAW via VST3/CLAP"
authors = ["brianmatzelle"]
license = "GPL-3.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# VST3/CLAP plugin framework
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }

# Windows Audio (WASAPI) - same version as src-tauri
wasapi = "0.22"

# Process enumeration - same version as src-tauri
sysinfo = "0.32"

# Lock-free SPSC ring buffer for real-time audio transfer
ringbuf = "0.4"

# Logging
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
